name: deploy-pages
# Astro static build → GitHub Pages. Pages auto-enables on the first
# successful run (API creation is Administration-gated on our token).
# CNAME lives in public/ so it lands in dist/ with the artifact.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:local
      # 雙語閘門：字典 key 對齊、簡體字形、中文軟換行（紅燈即不部署）
      - run: npm run check:i18n
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
